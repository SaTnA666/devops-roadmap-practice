services:
  db:
    image: postgres:16-alpine
    container_name: shop-db
    environment:
      POSTGRES_USER: shop_user
      POSTGRES_PASSWORD: superpassword
      POSTGRES_DB: autoparts_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: shop-api
    environment: # Добавили переменные для API!
      - DB_HOST=db # Имя хоста совпадает с названием сервиса базы данных
      - DB_USER=shop_user
      - DB_PASSWORD=superpassword
      - DB_NAME=autoparts_db
    ports:
      - "8080:8080"
    depends_on:
      - db
    
volumes:
  pg_data: